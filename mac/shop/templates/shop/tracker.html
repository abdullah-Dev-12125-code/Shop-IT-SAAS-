{% extends 'shop/basic.html' %}
{% load static %}

{% block css %}
<style>
    .heading {
        padding-top: 10px;
    }

    .heading h1 {
        text-align: center;
        font-weight: bolder;
        font-size: 50px;
        letter-spacing: 1px;
        color: #111827;
        margin-bottom: 0px;
    }

    .heading h1 span {
        color: #e8002d;
    }

    .heading p {
        text-align: center;
        letter-spacing: 2px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-size: 20px;
    }


    /* Container for both boxes */
    .tracker-container {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 0px;
        transition: gap 0.5s ease;

    }

    /* Once a search has been triggered, open up the gap between the two cards */
    .tracker-container.active {
        gap: 30px;
    }


    /* Main tracker box */
    .box {
        background-color: rgb(255, 255, 255);
        height: 300px;
        width: 400px;
        box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.15);
        border-radius: 50px;
        flex-shrink: 0;
    }


    .box-heading h6 {
        text-align: center;
        font-size: 20px;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        font-weight: bold;
    }


    .summary {
        margin: 40px 20px;
        padding: 20px;
        background: #f9fafb;
        border-radius: 12px;
        border-left: 5px solid #e8002d;
        border-right: 6px solid #111827;
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.08);
    }


    .summary p {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 17px;
        font-family: 'Segoe UI', sans-serif;
        font-weight: 600;
        color: #374151;
        padding: 12px 5px;
        margin: 0;
        border-bottom: 1px solid #e5e7eb;
    }


    .summary input {
        width: 170px;
        height: 30px;
        padding: 5px 10px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
    }


    .summary input:focus {
        border-color: #e8002d;
    }


    .submit-btn {
        display: block;
        margin: 20px auto 0px;
        width: 160px;
        height: 40px;
        background-color: #e8002d;
        color: white;
        border: none;
        border-radius: 20px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }


    .submit-btn:hover {
        background-color: #111827;
    }



    /* Status card */

    #order-status {

        /* starts completely collapsed so the order card sits centered alone */
        width: 0px;
        min-height: 300px;

        background: white;
        border-radius: 50px;

        box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.15);

        padding: 20px;

        box-sizing: border-box;
        overflow: hidden;
        flex-shrink: 0;

        opacity: 0;
        transform: translateX(50px);

        transition: width 0.5s ease, opacity 0.5s ease, transform 0.5s ease;

    }


    #order-status.show {

        width: 400px;
        opacity: 1;
        transform: translateX(0);

    }



    .status-box {

        margin-top: 15px;
        padding: 15px;

        background: #f9fafb;

        border-radius: 10px;

        border-left: 5px solid #e8002d;

        box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.1);

    }


    .status-box h5 {

        margin: 0;
        color: #111827;

    }


    .status-box p {

        margin-top: 5px;
        color: #6b7280;

    }
</style>
{% endblock %}



{% block body %}

<div class="wrapper">


    <div class="heading">

        <h1>Shop <span>IT</span></h1>

        <p>Track your orders here</p>

    </div>



    <div class="tracker-container">


        <div class="box">


            <div class="box-heading">
                <h6>Order</h6>
            </div>



            <form id="trackerform" method="POST">

                {% csrf_token %}


                <div class="summary">


                    <p>
                        Order ID:
                        <input type="text" id="orderid" name="orderid" placeholder="Enter Order id" required>
                    </p>



                    <p>
                        Email:
                        <input type="text" id="email" name="email" placeholder="Enter Email" required>
                    </p>



                    <button type="submit" class="submit-btn">
                        Track Order
                    </button>


                </div>


            </form>


        </div>




        <div id="order-status">

        </div>



    </div>


</div>

{% endblock %}





{% block js %}

<script>
    $('#trackerform').submit(function (event) {
        event.preventDefault();

        $('.tracker-container').addClass('active');

        let status = document.getElementById("order-status");
        status.classList.remove("show");

        let formdata = {
            orderid: $('#orderid').val(),
            email: $('#email').val(),
            csrfmiddlewaretoken: $('input[name=csrfmiddlewaretoken]').val()
        };

        $.ajax({
            type: 'POST',
            url: '/shop/tracker/',
            data: formdata
        })
            .done(function (data) {

                let html = "";

                if (!data.success) {
                    html = `
                <h3>Order Status</h3>
                <div class="status-box">
                    <h5>${data.message}</h5>
                </div>
            `;

                    status.innerHTML = html;
                    status.classList.add("show");
                    return;
                }

                html += "<h3>Order Status</h3>";

                // =====================
                // UPDATES
                // =====================
                let updates = data.update || [];

                updates.forEach(u => {
                    html += `
                <div class="status-box">
                    <h5>${u.text}</h5>
                    <p>${u.time}</p>
                </div>
            `;
                });

                // =====================
                // ITEMS
                // =====================
                if (data.items && data.items.length > 0) {

                    html += `
                <div class="status-box">
                    <h5>Items in Order</h5>
            `;

                    data.items.forEach(item => {
                        html += `
                    <p>
                        ${item.name} × ${item.qty}
                    </p>
                `;
                    });

                    html += `</div>`;
                }

                status.innerHTML = html;
                status.classList.add("show");

            })
            .fail(function (error) {
                console.log(error);
            });
    });
</script>

{% endblock %}
