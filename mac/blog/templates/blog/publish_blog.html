{% extends 'blog/basic.html' %}

{% block css %}
<style>
    body {
        margin: 0;
        padding: 0;
        background: #f4f6f8;
        font-family: Arial, sans-serif;
    }

    /* HEADER */
    .heading {
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 20px;
    }

    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap');

    .heading-h1 {
        margin: 0 auto;
        max-width: 700px;
        width: 100%;
        padding: 0 1.5rem 0.5em;
        color: #181716;
        background: transparent;
        text-align: center;
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-optical-sizing: auto;
        font-weight: 600;
        font-size: clamp(1.75rem, 1.3rem + 2.2vw, 2.75rem);
        line-height: 1.15;
        letter-spacing: -0.01em;
        text-wrap: balance;
    }

    .heading-h1::after {
        content: "";
        display: block;
        width: 44px;
        height: 3px;
        margin: 0.75em auto 0;
        background: #5b6b4f;
        border-radius: 2px;
    }

    /* make spans behave nicely */
    .heading-h1 span {
        font-weight: 900;
    }

    /* "about" is intentionally subtle */
    .about {
        color: #c4c4c4;
        font-weight: 300;
        letter-spacing: 3px;
        opacity: 0.6;
    }

    /* CONTAINER */
    .container {
        display: flex;
        justify-content: center;
        padding: 20px;
    }

    .wrapper {
        background: white;
        width: 700px;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    li {
        margin-bottom: 18px;
    }

    label {
        font-weight: bold;
        font-size: 14px;
        color: #333;
    }

    input,
    textarea {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: 0.2s;
        box-sizing: border-box;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    input:focus,
    textarea:focus {
        border-color: #4a90e2;
        box-shadow: 0 0 6px rgba(74, 144, 226, 0.4);
    }

    button {
        width: 100%;
        padding: 12px;
        background: black;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
    }

    button:hover {
        background: #333;
    }
</style>
{% endblock %}


{% block body %}

<div class="heading">
    <h1 class="heading-h1">
        Post <span class="about">About</span> <span>Anything</span>
    </h1>
</div>

<div class="container">
    <div class="wrapper">

        <form method="POST" enctype="multipart/form-data" action="{% url 'blog:publish_blog' %}">
            {% csrf_token %}

            <ul>

                <li>
                    <label for="title">Title</label>
                    <input type="text" name="title" id="title">
                </li>

                <li>
                    <label for="head1">First Heading</label>
                    <input type="text" name="head1" id="head1">
                </li>

                <li>
                    <label for="cont1">Content</label>
                    <textarea name="cont1" id="cont1"></textarea>
                </li>

                <li>
                    <label for="head2">Second Heading</label>
                    <input type="text" name="head2" id="head2">
                </li>

                <li>
                    <label for="cont2">Content</label>
                    <textarea name="cont2" id="cont2"></textarea>
                </li>

                <li>
                    <label for="head3">Third Heading/Subheading</label>
                    <input type="text" name="head3" id="head3">
                </li>

                <li>
                    <label for="cont3">Content</label>
                    <textarea name="cont3" id="cont3"></textarea>
                </li>

                <li>
                    <label for="imageUpload">Image/url</label>
                    <input type="file" id="imageUpload" name="imageUpload" accept="image/*">
                </li>

            </ul>

            <button type="submit">Publish</button>

        </form>

    </div>
</div>

{% endblock %}
