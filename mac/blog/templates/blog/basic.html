{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">
  <title>{% block title %}Blog{% endblock %}</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background: #f4f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #111;
    }

    .main-content {
      flex: 1;
    }

    .navbar-custom {
      background: #ffffff;
      border-bottom: 1px solid #e8e8e8;
      padding: 0 1.5rem;
      height: 62px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      padding: 0;
    }

    .navbar-brand svg {
      width: 170px;
      height: auto;
      display: block;
    }

    .nav-link {
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151 !important;
      padding: 0.4rem 0.75rem !important;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .nav-link:hover {
      background: #f4f4f6;
    }
  </style>

  {% block css %}{% endblock %}
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-custom">

    <a class="navbar-brand" href="{% url 'blog:blog' %}">

      <!-- ✅ UPDATED SVG ONLY -->
      <svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" aria-labelledby="logoTitle"
        role="img">

        <title id="logoTitle">BLOG Logo</title>
        <desc>Clean light-mode BLOG logo</desc>

        <rect x="35" y="35" width="730" height="210" rx="105" ry="105" fill="none" stroke="#ffffff" stroke-width="6" />

        <defs>
          <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <g filter="url(#softGlow)">

          <g transform="translate(115, 92)">

            <line x1="0" y1="-38" x2="0" y2="-12" stroke="#111111" stroke-width="5" stroke-linecap="round" />
            <circle cx="0" cy="-42" r="7" fill="none" stroke="#111111" stroke-width="5" />

            <circle cx="0" cy="2" r="20" fill="none" stroke="#111111" stroke-width="5" />

            <rect x="-22" y="24" width="44" height="52" rx="6" ry="6" fill="none" stroke="#111111" stroke-width="5" />

            <line x1="-10" y1="29" x2="-10" y2="71" stroke="#111111" stroke-width="3.5" />
            <line x1="0" y1="29" x2="0" y2="71" stroke="#111111" stroke-width="3.5" />
            <line x1="10" y1="29" x2="10" y2="71" stroke="#111111" stroke-width="3.5" />

            <line x1="-22" y1="35" x2="-48" y2="22" stroke="#111111" stroke-width="5" stroke-linecap="round" />
            <line x1="22" y1="35" x2="48" y2="22" stroke="#111111" stroke-width="5" stroke-linecap="round" />

            <line x1="-10" y1="76" x2="-10" y2="102" stroke="#111111" stroke-width="5" stroke-linecap="round" />
            <line x1="10" y1="76" x2="10" y2="102" stroke="#111111" stroke-width="5" stroke-linecap="round" />

            <circle cx="-10" cy="108" r="9" fill="none" stroke="#111111" stroke-width="5" />
            <circle cx="10" cy="108" r="9" fill="none" stroke="#111111" stroke-width="5" />

          </g>

          <line x1="295" y1="88" x2="505" y2="88" stroke="#111111" stroke-width="3" stroke-linecap="round" />
          <line x1="295" y1="98" x2="505" y2="98" stroke="#111111" stroke-width="3" stroke-linecap="round" />

          <text x="295" y="162" font-family="Arial Black, sans-serif" font-size="76" font-weight="900" fill="#111111"
            letter-spacing="2">
            BLOG
          </text>

        </g>

      </svg>

    </a>

    <div class="collapse navbar-collapse" id="nav">

      <ul class="navbar-nav ml-auto align-items-lg-center">

        <li class="nav-item">
          <a class="nav-link" href="{% url 'blog:blog' %}">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'shop:shop' %}">Shop</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'blog:contact' %}">Contact</a>
        </li>

      
        <li class="nav-item">
          <a class="nav-link" href="">
            <svg fill="#000000" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 45.532 45.532" xml:space="preserve"
              width="24" height="24" role="img" aria-label="User profile"
              style="display:block;flex:0 0 auto;">
              <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
              <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
              <g id="SVGRepo_iconCarrier">
                <g>
                  <path
                    d="M22.766,0.001C10.194,0.001,0,10.193,0,22.766s10.193,22.765,22.766,22.765c12.574,0,22.766-10.192,22.766-22.765 S35.34,0.001,22.766,0.001z M22.766,6.808c4.16,0,7.531,3.372,7.531,7.53c0,4.159-3.371,7.53-7.531,7.53 c-4.158,0-7.529-3.371-7.529-7.53C15.237,10.18,18.608,6.808,22.766,6.808z M22.761,39.579c-4.149,0-7.949-1.511-10.88-4.012 c-0.714-0.609-1.126-1.502-1.126-2.439c0-4.217,3.413-7.592,7.631-7.592h8.762c4.219,0,7.619,3.375,7.619,7.592 c0,0.938-0.41,1.829-1.125,2.438C30.712,38.068,26.911,39.579,22.761,39.579z">
                  </path>
                </g>
              </g>
            </svg></a>
        </li>

      </ul>

    </div>

    <button class="navbar-toggler" data-toggle="collapse" data-target="#nav"
      style="border:none;background:none;font-size:1.3rem;">
      ☰
    </button>

  </nav>

  <!-- CONTENT -->
  <main class="main-content">
    {% block body %}{% endblock %}
  </main>

</body>

</html>
